services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: apipulse_pg
    environment:
      POSTGRES_USER: apipulse
      POSTGRES_PASSWORD: apipulse123
      POSTGRES_DB: apipulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: apipulse_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata: